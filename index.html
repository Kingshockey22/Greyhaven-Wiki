const A={
main:{t:'Campaign Wiki',b:`<p class="lead">A player-facing encyclopedia for the post-apocalyptic campaign centered on <a href="#greyhaven">Greyhaven</a>, the <a href="#magic">return of magic</a>, and the search for the people who vanished.</p><div class="notice"><b>Player Knowledge Only.</b> Confirmed discoveries are kept separate from rumors, theories, and unresolved mysteries.</div><h2>Current state of the campaign</h2><p><a href="#magic">Magic</a>, absent for roughly one thousand years, has begun to return. <a href="#greyhaven">Greyhaven</a>'s people vanished, strange phenomena appeared, and the investigation drew the party through <a href="#locations">Dunlo and Bellwether</a> and aboard the <a href="#maribel"><i>Maribel</i></a>. After a violent struggle with Crown-aligned forces, the ship was crippled and later sank. The survivors escaped on a makeshift raft with Tyrus and limited supplies.</p><h2>Featured articles</h2><div class="cards"><a href="#greyhaven"><b>Greyhaven</b><span>The vanished hometown at the center of the mystery.</span></a><a href="#magic"><b>The Return of Magic</b><span>Magic has reappeared after a millennium.</span></a><a href="#crown"><b>The Crown</b><span>The authority increasingly tied to the investigation.</span></a><a href="#maribel"><b>The Maribel</b><span>The ship at the center of the Crown cargo and mutiny.</span></a><a href="#mysteries"><b>Unresolved Mysteries</b><span>Questions the party still cannot answer.</span></a><a href="#sessions"><b>Session Archive</b><span>Campaign history through Session 6.</span></a></div><h2>Campaign premise</h2><p>One thousand years ago, magic vanished. The gods stopped answering, miracles ceased, ancient wonders failed, floating cities fell, dragons disappeared, and civilizations built around magic collapsed. The world rebuilt until magic was regarded largely as myth. Then impossible events began again: wounds closed, lights appeared without flame, prayers received answers, and ancient symbols worked once more.</p>`},
greyhaven:{t:'Greyhaven',b:`<div class="infobox"><b>Greyhaven</b><p><b>Type:</b> Settlement<br><b>Status:</b> Population vanished<br><b>Region:</b> Landlocked; near a mountain<br><b>Importance:</b> Party hometown</p></div><p><b>Greyhaven</b> is the party's home settlement and the origin of the campaign's central mystery. Its inhabitants disappeared under unexplained circumstances. The surrounding area also became devoid of wildlife; animals returned roughly two hours away, suggesting a geographically limited phenomenon.</p><h2>The disappearance</h2><p>A strange light was observed in Greyhaven's direction. <a href="#characters">Corrin</a> later described visions connected to the event, including a door beneath a mountain and the word <b>“OPEN.”</b> He believed the missing people could be connected to that door.</p><h2>Crown presence</h2><p>The party understood Greyhaven to have essentially no direct <a href="#crown">Crown</a> presence. Representatives were rarely, if ever, seen there, although taxes were periodically collected and taken toward Dunlo.</p><h2>See also</h2><p><a href="#characters">Characters</a><a href="#taurus">Taurus</a><a href="#corrin">Corrin Bale</a> · <a href="#magic">Magic and Ancient Lore</a> · <a href="#mysteries">Unresolved Mysteries</a> · <a href="#sessions">Session Archive</a></p>`},
locations:{t:'Locations',b:`<h2>Dunlo</h2><p>A settlement of roughly 2,000 people and one of the party's first destinations after <a href="#greyhaven">Greyhaven</a>. The party regrouped there before traveling onward.</p><h2>Bellwether</h2><p>A larger coastal city with a military presence. The party traveled there seeking information and assistance, researched old lore, investigated <a href="#characters">Corrin</a>, and became involved with the <a href="#maribel"><i>Maribel</i></a>.</p><h2>The western sea</h2><p><a href="#characters">Corrin</a> became convinced the missing people of <a href="#greyhaven">Greyhaven</a> could be found by sailing west. The route was dangerous and outside ordinary shipping lanes. The party later sailed into these waters aboard the <a href="#maribel"><i>Maribel</i></a>, although their exact distance from land became unknown.</p>`},

taurus:{t:'Taurus',b:`<div class="infobox"><b>Taurus</b><dl><dt>Race</dt><dd>Minotaur</dd><dt>Class</dt><dd>Barbarian</dd><dt>Background</dt><dd>Soldier</dd><dt>Home</dt><dd><a href="#greyhaven">Greyhaven</a></dd><dt>Status</dt><dd>Alive</dd></dl></div><p><b>Taurus</b> is a Minotaur barbarian from <a href="#greyhaven">Greyhaven</a> and one of the adventurers searching for the settlement's missing inhabitants.</p><h2>Biography</h2><h3>Greyhaven and Bellwether</h3><p>Taurus pursued answers about Greyhaven through Dunlo and <a href="#locations">Bellwether</a>. He and Shin were among those who directly questioned <a href="#corrin">Corrin Bale</a> about the Greyhaven phenomenon.</p><h3>Voyage aboard the Maribel</h3><p>Taurus joined the voyage aboard the <a href="#maribel"><i>Maribel</i></a>, participated in the mutiny against Crown-aligned personnel, and helped defeat <a href="#lucan">Lucan</a>.</p><h3>Shipwreck</h3><p>After the battle, Taurus remained with the survivors as they investigated the Crown cargo and abandoned the sinking ship aboard a makeshift raft.</p><h2>Personality</h2><p>The transcripts establish Taurus as direct and physically assertive, but do not yet support a complete personality profile.</p><h2>Abilities and Combat</h2><p>Taurus is a barbarian whose documented combat role emphasizes physical strength and close combat. Further mechanical details will be added as they become relevant in play.</p><h2>Relationships</h2><p>Known companions include <a href="#shin">Shin</a>, <a href="#zavros">Zavros</a>, <a href="#tyrus">Tyrus</a>, <a href="#sterling">Sterling</a>, and <a href="#otter">Otter</a>.</p><h2>Appearances</h2><p><a href="#sessions">Sessions 2–6</a></p>`},
shin:{t:'Shin',b:`<div class="infobox"><b>Shin</b><dl><dt>Race</dt><dd>Goliath</dd><dt>Status</dt><dd>Alive</dd><dt>Affiliation</dt><dd>Adventuring party</dd></dl></div><p><b>Shin</b> is a Goliath adventurer involved in the investigation of <a href="#greyhaven">Greyhaven</a>.</p><h2>Biography</h2><p>Shin returned to a Goliath village and found it abandoned, with animals also absent from the surrounding region. He encountered <a href="#zavros">Zavros</a>, traveled through Greyhaven toward Dunlo, and later joined the investigation in Bellwether.</p><h2>Maribel</h2><p>Shin fought Crown-aligned personnel during the mutiny and survived the battle against <a href="#lucan">Lucan</a>. During the fighting he was struck by a magical blast powerful enough to throw him across the ship.</p><h2>Appearances</h2><p><a href="#sessions">Session 2 onward</a></p>`},
zavros:{t:'Zavros',b:`<div class="infobox"><b>Zavros</b><dl><dt>Race</dt><dd>Half-elf</dd><dt>Background</dt><dd>Hermit</dd><dt>Status</dt><dd>Alive</dd></dl></div><p><b>Zavros</b> is a half-elf hermit encountered by <a href="#shin">Shin</a>.</p><h2>Return of Magic</h2><p>Zavros experienced signs of newly awakened magic, including a guiding voice and lighting a fire without flint.</p><h2>Journey</h2><p>He accompanied Shin toward Greyhaven and Dunlo and later traveled with the wider party through Bellwether and aboard the <a href="#maribel"><i>Maribel</i></a>.</p>`},
tyrus:{t:'Tyrus',b:`<div class="infobox"><b>Tyrus</b><dl><dt>Status</dt><dd>Alive</dd><dt>Affiliation</dt><dd>Adventuring party</dd><dt>Last documented condition</dt><dd>Unconscious after treatment</dd></dl></div><p><b>Tyrus</b> is a member of the adventuring party.</p><h2>Battle and Shipwreck</h2><p>Tyrus was critically injured during the fighting aboard the <a href="#maribel"><i>Maribel</i></a>. After combat ended, the party rescued him and Cure Wounds closed his injuries, though he remained unconscious. He was carried from the sinking vessel and escaped with the party on the homemade raft.</p>`},
sterling:{t:'Sterling',b:`<div class="infobox"><b>Sterling</b><dl><dt>Status</dt><dd>Alive</dd><dt>Affiliation</dt><dd>Adventuring party</dd></dl></div><p><b>Sterling</b> is a member of the adventuring party and a survivor of the <a href="#maribel"><i>Maribel</i></a>.</p><h2>Maribel</h2><p>Sterling participated in the fight against <a href="#lucan">Lucan</a>. After combat, Sterling was on the aft quarter while the survivors assessed the vessel's damage.</p><h2>Article status</h2><p>Ancestry, class, and personal history have not yet been firmly established in the available player record.</p>`},
otter:{t:'Otter',b:`<div class="infobox"><b>Otter</b><dl><dt>Status</dt><dd>Alive</dd><dt>Affiliation</dt><dd>Adventuring party</dd><dt>Known magic</dt><dd>Mending</dd></dl></div><p><b>Otter</b> is a member of the adventuring party who began experimenting with returning magic aboard the <a href="#maribel"><i>Maribel</i></a>.</p><h2>Magic</h2><p>Otter discovered the ability to use <b>Mending</b>, a useful form of magic during the survivors' attempts to repair the damaged ship.</p>`},
corrin:{t:'Corrin Bale',b:`<div class="infobox"><b>Corrin Bale</b><dl><dt>Race</dt><dd>Half-orc</dd><dt>Role</dt><dd>Former captain associated with the Maribel</dd><dt>Status</dt><dd>Alive when last encountered</dd><dt>Known for</dt><dd>Greyhaven visions; westward obsession</dd></dl></div><p><b>Corrin Bale</b> is a former captain associated with the <a href="#maribel"><i>Maribel</i></a> and an important witness to the <a href="#greyhaven">Greyhaven</a> phenomenon.</p><h2>Greyhaven</h2><p>Corrin witnessed an extraordinary light in Greyhaven's direction. He became fixated on a recurring symbol and described visions involving a door beneath a mountain and the word <b>“OPEN.”</b> He believed the missing residents were somehow connected to the door.</p><h2>Removal from Command</h2><p>Corrin became increasingly erratic, repeatedly drew the symbol, and attempted to direct the ship straight west without explaining his destination. Those waters lay outside normal shipping lanes and were considered dangerous.</p><h2>Legacy</h2><p>His insistence on sailing west became one of the party's strongest leads in the search for Greyhaven's people.</p><h2>Related</h2><p><a href="#mysteries">Unresolved Mysteries</a> · <a href="#maribel">Maribel</a> · <a href="#greyhaven">Greyhaven</a></p>`},
captain:{t:'Captain of the Maribel',b:`<div class="infobox"><b>Captain of the Maribel</b><dl><dt>Role</dt><dd>Captain</dd><dt>Status</dt><dd>Deceased</dd><dt>Name</dt><dd>Not established in current record</dd></dl></div><p>The unnamed <b>captain of the <i>Maribel</i></b> commanded the vessel after <a href="#corrin">Corrin Bale</a> was removed. Crown personnel gradually reduced her to a figurehead.</p><h2>Resistance to the Crown</h2><p>She agreed to work with the party to retake her ship. During the mutiny she rejected the Crown commander's authority and demonstrated newly awakened magic by commanding the ship's ropes.</p><h2>Death</h2><p>She was badly attacked during the battle and died amid the fighting.</p>`},
pip:{t:'Pip Burrows',b:`<div class="infobox"><b>Pip Burrows</b><dl><dt>Role</dt><dd>Bosun</dd><dt>Status</dt><dd>Deceased</dd><dt>Affiliation</dt><dd>Maribel crew / captain loyalist</dd></dl></div><p><b>Pip Burrows</b> was the bosun aboard the <a href="#maribel"><i>Maribel</i></a> and one of the crew members identified as unquestionably loyal to the captain.</p><h2>Mutiny</h2><p>Pip supported the effort to remove Crown control and was killed during the confrontation.</p>`},
sella:{t:'Sella Vane',b:`<div class="infobox"><b>Sella Vane</b><dl><dt>Race</dt><dd>Human</dd><dt>Role</dt><dd>Shipwright</dd><dt>Status</dt><dd>Not confirmed deceased</dd><dt>Known magic</dt><dd>Magical repair</dd></dl></div><p><b>Sella Vane</b> was a shipwright aboard the <a href="#maribel"><i>Maribel</i></a> and a reliable supporter of the captain.</p><h2>Background</h2><p>Sella had worked on Crown warships for decades before defecting.</p><h2>Magic</h2><p>She demonstrated a newly awakened ability to magically repair objects.</p>`},
gulls:{t:'Gulls',b:`<div class="infobox"><b>Gulls</b><dl><dt>Role</dt><dd>Maribel crew member</dd><dt>Status</dt><dd>Deceased</dd><dt>Known magic</dt><dd>Weapon empowerment</dd></dl></div><p><b>Gulls</b> was a confirmed supporter of the captain aboard the <a href="#maribel"><i>Maribel</i></a>.</p><h2>Magic and Death</h2><p>Gulls demonstrated the ability to magically empower a weapon and was later killed during the Crown confrontation.</p>`},
nessa:{t:'Nessa Reed',b:`<div class="infobox"><b>Nessa Reed</b><dl><dt>Role</dt><dd>Maribel crew member</dd><dt>Status</dt><dd>Deceased</dd></dl></div><p><b>Nessa Reed</b> was a crew member aboard the <a href="#maribel"><i>Maribel</i></a> and a possible ally during preparations for the mutiny.</p><h2>Death</h2><p>Nessa was killed when <a href="#lucan">Lucan</a> entered the battle.</p>`},
lucan:{t:'Lucan',b:`<div class="infobox"><b>Lucan</b><dl><dt>Race</dt><dd>Orc</dd><dt>Status</dt><dd>Deceased</dd><dt>Affiliation</dt><dd>Crown forces</dd></dl></div><p><b>Lucan</b> was a gigantic orc who emerged from below deck during the <a href="#maribel">Maribel mutiny</a> and fought on the Crown's side.</p><h2>Battle</h2><p>Lucan killed <a href="#nessa">Nessa Reed</a> and brutally attacked the captain. After the Crown commander withdrew, blood from those killed aboard the ship flowed into Lucan, empowering him and causing his eyes to glow red.</p><h2>Death</h2><p>The surviving adventurers coordinated their attacks and eventually killed Lucan.</p>`},
commander:{t:'Crown Commander',b:`<div class="infobox"><b>Crown Commander</b><dl><dt>Role</dt><dd>Crown agent / commander</dd><dt>Status</dt><dd>Alive; escaped</dd><dt>Known magic</dt><dd>Levitation, destructive magic, blood empowerment</dd></dl></div><p>The <b>Crown commander</b> was the most powerful known Crown agent encountered aboard the <a href="#maribel"><i>Maribel</i></a>.</p><h2>Abilities</h2><p>He demonstrated levitation and destructive magic. Before leaving, he used blood from the dead to empower <a href="#lucan">Lucan</a>.</p><h2>Escape</h2><p>He withdrew after warning the party that he would return with more forces. His current location is unknown.</p>`},
crown:{t:'The Crown',b:`<div class="infobox"><b>The Crown</b><p><b>Type:</b> Governing authority<br><b>Relationship:</b> Under investigation<br><b>Known interests:</b> Magic and maritime cargo</p></div><p><a href="#crown">The Crown</a> is the governing authority encountered during the party's investigation. Evidence available to the party raises questions about its relationship with <a href="#magic">returning magic</a> and its maritime operations.</p><h2>Magic</h2><p>The party found a recent Crown-sealed publication asserting that magic had never existed. At the same time, people displaying magic risked arrest, while Crown-aligned personnel aboard the <a href="#maribel"><i>Maribel</i></a> demonstrated magical abilities.</p><h2>The cargo operation</h2><p>Six Crown employees joined the ship in connection with cargo work and effectively displaced the captain's authority. After the mutiny, the party discovered seven Crown cargo boxes containing apparent relief grain contaminated by black, swollen kernels with moving tendrils. Records also identified a heavy chest containing roughly 200,000 gold pieces.</p><p class="unknown"><b>Unknown:</b> The purpose of the contaminated grain, the intended dumping site, and the broader Crown objective.</p><h2>See also</h2><p><a href="#magic">Magic and Ancient Lore</a> · <a href="#maribel">The Maribel</a> · <a href="#mysteries">Unresolved Mysteries</a></p>`},
magic:{t:'Magic and Ancient Lore',b:`<h2>The return</h2><p>Magic has returned after approximately one thousand years. The party has witnessed or learned of newly emerging magical effects among ordinary people and Crown personnel.</p><h2>Dragons</h2><p>A text titled <i>Death of the First Dragon</i> described dragons as having an exceptionally pure connection to magic. The death of the First Dragon occurred around the period when magic disappeared, but the source did not establish causation. After magic vanished, dragons reportedly became vulnerable and were hunted to extinction.</p><h2>The hidden collection</h2><p>The party found an account concerning an unnamed king who was also an archmage and who gathered ancient creatures and magical oddities into a hidden location.</p><h2>Sea legends</h2><p>Research in Bellwether uncovered stories of the <b>Sea Beneath the Sea</b>, the <b>Sleeping Tide Mother</b>, and a forested island said to change position and disappear with crews that land upon it. Their truth remains unconfirmed.</p><h2>See also</h2><p><a href="#greyhaven">Greyhaven</a> · <a href="#crown">The Crown</a> · <a href="#mysteries">Unresolved Mysteries</a></p>`},
maribel:{t:'The Maribel',b:`<div class="infobox"><b>Maribel</b><p><b>Type:</b> Sailing vessel<br><b>Former captain:</b> Corrin<br><b>Final status:</b> Sunk<br><b>Notable cargo:</b> Crown crates and heavy chest</p></div><p>The <a href="#maribel"><i>Maribel</i></a> became central to the investigation after the party learned of <a href="#characters">Corrin</a>'s desire to sail west and the <a href="#crown">Crown</a>'s growing control over the vessel.</p><h2>Mutiny</h2><p>The party joined the captain in an attempt to remove Crown influence. They recruited trusted crew and investigated uncertain loyalties. The plan collapsed into open combat after magical activity was witnessed and reported.</p><h2>Massacre</h2><p>A Crown commander displayed powerful magic and eventually withdrew, leaving the gigantic orc Lucan behind. Blood from those killed aboard the vessel was magically drawn into Lucan, empowering him. The party killed Lucan, but the captain and several allies died and the ship was severely damaged.</p><h2>Loss of the ship</h2><p>The survivors attempted emergency repairs to flooding, the rudder connection, and the broken mast. The damage became uncontrollable, forcing the party to build a raft from barrels and planks and abandon ship.</p><h2>See also</h2><p><a href="#characters">Characters</a><a href="#taurus">Taurus</a><a href="#corrin">Corrin Bale</a> · <a href="#crown">The Crown</a> · <a href="#mysteries">Unresolved Mysteries</a> · <a href="#sessions">Session Archive</a></p>`},
mysteries:{t:'Unresolved Mysteries',b:`<p class="lead">These questions are intentionally separated from confirmed campaign facts.</p><h2>What happened to <a href="#greyhaven">Greyhaven</a>?</h2><p>The population vanished during a localized event associated with a strange light. Corrin's visions suggest a possible connection to a door beneath a mountain.</p><h2>What does the symbol mean?</h2><p>Corrin repeatedly drew a rough circle broken at the top with three descending lines. Why he recognized it remains unresolved.</p><h2>Why did <a href="#magic">magic</a> return?</h2><p>Neither the original disappearance nor the recent return has a confirmed cause.</p><h2>What is <a href="#crown">the Crown</a> hiding?</h2><p>The Crown publicly denied magic while Crown-associated personnel used it and controlled a secretive maritime cargo operation. The extent and purpose of any concealment remain unknown.</p><h2>What was wrong with the grain?</h2><p>The Crown crates contained apparent relief grain contaminated by black, swollen kernels with moving tendrils. Its nature and purpose remain unknown.</p><h2>What lies west?</h2><p>Corrin believed the missing people could be found by sailing west. The party has not established what lies at his intended destination.</p><h2>See also</h2><p><a href="#greyhaven">Greyhaven</a> · <a href="#crown">The Crown</a> · <a href="#magic">Magic and Ancient Lore</a> · <a href="#timeline">Campaign Timeline</a></p>`},
timeline:{t:'Campaign Timeline',b:`<div class="timeline"><div><b>~1,000 years ago</b><p>Magic disappears; magical civilizations collapse and dragons vanish.</p></div><div><b>Recent days</b><p>Impossible magical events begin occurring again.</p></div><div><b><a href="#greyhaven">Greyhaven vanishes</a></b><p>Residents disappear and wildlife is absent around the affected region.</p></div><div><b><a href="#locations">Dunlo & Bellwether</a></b><p>The party regroups, researches magic and dragons, and investigates Corrin.</p></div><div><b><a href="#maribel">Voyage aboard the Maribel</a></b><p>The party joins the Crown-influenced ship and prepares a mutiny.</p></div><div><b><a href="#maribel">Mutiny & massacre</a></b><p>The Crown commander and Lucan devastate the crew. The party defeats Lucan.</p></div><div><b><a href="#maribel">Shipwreck</a></b><p>The Crown cargo is investigated, the <i>Maribel</i> sinks, and the survivors escape on a homemade raft.</p></div></div>`},
sessions:{t:'Session Archive',b:`<h2>Session 2 Summary — <i>The Disappearance of Greyhaven</i></h2><p>Shin returned to his Goliath village and found it abandoned, mirroring Greyhaven, with wildlife absent throughout the area. After meeting Zavros, the pair traveled through Greyhaven and followed the others toward Dunlo. Reunited, the party continued to Bellwether, where Corrin's testimony linked the Greyhaven light to a mysterious symbol, the word “OPEN,” and a vision of a door beneath a mountain.</p><h2>Session 3 Summary — <i>Secrets of the Crown and the Voyage West</i></h2><p>Research in Bellwether connected dragons closely with magic and revealed a recent Crown-sealed book denying that magic had ever existed. The party investigated the <i>Maribel</i>, learned that Corrin had become obsessed with sailing west, and discovered that Crown personnel had effectively taken control of the ship.</p><h2>Session 4 Summary — <i>Mutiny Aboard the Maribel</i></h2><p>The party quietly prepared to retake the ship, recruiting trusted crew and investigating uncertain loyalties. Magical abilities appeared among people aboard. A magically summoned ferret was witnessed by two crew members who immediately ran below deck, threatening to expose the planned mutiny.</p><h2>Session 5 Summary — <i>Mutiny and Massacre Aboard the Maribel</i></h2><p>The mutiny erupted into open combat. Crown-aligned personnel wielded magic, a powerful commander levitated above deck, and Lucan emerged as a devastating threat. Nessa, Gulls, Pip, and the captain were killed. The commander withdrew after magically empowering Lucan with blood from the dead, but the party ultimately killed the orc.</p><h2>Session 6 Summary — <i>Shipwreck, Crown Cargo, and the Homemade Raft</i></h2><p>The survivors struggled to save the crippled ship, treating Tyrus, slowing the flooding, repairing the rudder chain, and cutting away the broken mast. Searching the Crown cargo revealed contaminated relief grain, records for seven boxes, and a heavy chest holding roughly 200,000 gold pieces. New leaks overwhelmed the repairs. The party built a makeshift raft and escaped as the ship sank.</p>`}}
